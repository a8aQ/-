<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1st Anniversary</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #fce4ec;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #4a4a4a;
            overflow: hidden;
        }
        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }

        /* 1. 封筒画面 */
        #envelope-screen {
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        #envelope-screen:active {
            transform: scale(0.95);
        }
        .envelope-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .tap-instruction {
            font-size: 16px;
            font-weight: bold;
            color: #d81b60;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* 2. スライドショー画面 */
        #slideshow-screen {
            display: none;
        }
        .slide-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        /* 3. メッセージ画面 */
        #message-screen {
            display: none;
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: left;
            max-height: 70vh;
            overflow-y: auto;
        }
        .message-text {
            font-size: 15px;
            line-height: 1.8;
            white-space: pre-wrap;
            color: #333;
        }
        .cursor {
            display: inline-block;
            width: 2px;
            height: 15px;
            background-color: #d81b60;
            animation: blink 0.7s infinite;
            vertical-align: middle;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="envelope-screen" onclick="startExperience()">
        <div class="envelope-icon">✉️</div>
        <div class="tap-instruction">タップして開く</div>
    </div>

    <div id="slideshow-screen">
        <img id="slideshow-image" class="slide-img" src="" alt="Memory">
    </div>

    <div id="message-screen">
        <div class="message-text" id="typed-text"></div><span class="cursor" id="cursor"></span>
    </div>
</div>

<script>
    // ▼ 1. 画像のURL（またはパス）を順番に入れてください
    const photos = [
        "https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=500", // 画像1
        "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=500", // 画像2
        "https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=500"  // 画像3
    ];

    // ▼ 2. 手紙の本文を入力してください（\n で改行できます）
    const message = `〇〇へ\n\n今日で付き合って1年だね。\nあっという間の1年だったけど、振り返ると楽しい思い出ばかりです。\n\nいつも隣で笑って支えてくれて本当にありがとう。\n\nこれからも一緒にいろんなところに行って、たくさんの思い出を作っていこうね。\n\nいつもありがとう。これからもよろしく！`;

    // 演出用プログラム
    let photoIndex = 0;
    const slideImg = document.getElementById('slideshow-image');

    function startExperience() {
        document.getElementById('envelope-screen').style.display = 'none';
        document.getElementById('slideshow-screen').style.display = 'block';
        showNextPhoto();
    }

    function showNextPhoto() {
        if (photoIndex < photos.length) {
            slideImg.style.opacity = 0;
            setTimeout(() => {
                slideImg.src = photos[photoIndex];
                slideImg.style.opacity = 1;
                photoIndex++;
                setTimeout(showNextPhoto, 3000); // 3秒ごとに切り替え
            }, 500);
        } else {
            // スライドショー終了後、メッセージへ
            setTimeout(() => {
                document.getElementById('slideshow-screen').style.display = 'none';
                document.getElementById('message-screen').style.display = 'block';
                typeWriter();
            }, 1000);
        }
    }

    let charIndex = 0;
    function typeWriter() {
        if (charIndex < message.length) {
            document.getElementById('typed-text').textContent += message.charAt(charIndex);
            charIndex++;
            setTimeout(typeWriter, 100); // タイピング速度（ミリ秒）
        } else {
            document.getElementById('cursor').style.display = 'none';
        }
    }
</script>
</body>
</html>
