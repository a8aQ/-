<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1st Anniversary</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #fce4ec;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #4a4a4a;
            overflow: hidden;
            transition: background-color 1.5s ease;
        }
        body.dark-mode {
            background-color: #111111;
        }

        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }

        /* 1. 封筒画面 */
        #envelope-screen {
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        #envelope-screen:active {
            transform: scale(0.95);
        }
        .envelope-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .tap-instruction {
            font-size: 16px;
            font-weight: bold;
            color: #d81b60;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* 2. 手紙（メッセージ）画面 */
        #message-screen {
            display: none;
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: left;
            max-height: 70vh;
            overflow-y: auto;
            transition: opacity 1s ease;
        }
        .message-text {
            font-size: 15px;
            line-height: 1.8;
            white-space: pre-wrap;
            color: #333;
        }
        .cursor {
            display: inline-block;
            width: 2px;
            height: 15px;
            background-color: #d81b60;
            animation: blink 0.7s infinite;
            vertical-align: middle;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 3. ぼわーっと出る一言（暗転後） */
        #fade-word-screen {
            display: none;
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            line-height: 1.6;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            letter-spacing: 2px;
        }

        /* 4. 最後の写真画面 */
        #final-photo-screen {
            display: none;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }
        .final-img {
            width: 100%;
            max-height: 60vh;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- STEP 1: 封筒画面 -->
    <div id="envelope-screen" onclick="startExperience()">
        <div class="envelope-icon">✉️</div>
        <div class="tap-instruction">タップして開く</div>
    </div>

    <!-- STEP 2: メッセージ画面（タイピング演出） -->
    <div id="message-screen">
        <div class="message-text" id="typed-text"></div><span class="cursor" id="cursor"></span>
    </div>

    <!-- STEP 3: ぼわーっと出る一言 -->
    <div id="fade-word-screen" id="fade-text">
        いつも本当にありがとう。<br>これからもよろしくね。
    </div>

    <!-- STEP 4: 最後の写真 -->
    <div id="final-photo-screen">
        <img class="final-img" id="final-image" src="" alt="1st Anniversary Photo">
    </div>
</div>

<script>
    // ▼ 1. 最後に表示したい写真のURLを入力してください
    const finalPhotoUrl = "https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=500";

    // ▼ 2. 手紙の本文を入力してください（\n で改行できます）
    const message = `〇〇へ\n\n今日で付き合って1年だね。\nあっという間の1年だったけど、振り返ると楽しい思い出ばかりです。\n\nいつも隣で笑って支えてくれて本当にありがとう。\n\nこれからも一緒にいろんなところに行って、たくさんの思い出を作っていこうね。`;

    // ▼ 3. 暗転後に浮き出る一言を変更したい場合は、上記の HTML 内 (<div id="fade-word-screen">) の文章を直接編集してください。

    function startExperience() {
        document.getElementById('envelope-screen').style.display = 'none';
        document.getElementById('message-screen').style.display = 'block';
        typeWriter();
    }

    let charIndex = 0;
    function typeWriter() {
        if (charIndex < message.length) {
            document.getElementById('typed-text').textContent += message.charAt(charIndex);
            charIndex++;
            setTimeout(typeWriter, 100); // タイピング速度（ミリ秒）
        } else {
            document.getElementById('cursor').style.display = 'none';
            // タイピング終了後、2.5秒待ってから暗転フェーズへ
            setTimeout(transitionToDark, 2500);
        }
    }

    function transitionToDark() {
        const msgScreen = document.getElementById('message-screen');
        msgScreen.style.opacity = '0';

        setTimeout(() => {
            msgScreen.style.display = 'none';
            document.body.classList.add('dark-mode'); // 背景を黒に変更

            // 1.5秒後に一言をぼわーっと表示
            setTimeout(() => {
                const fadeWord = document.getElementById('fade-word-screen');
                fadeWord.style.display = 'block';
                setTimeout(() => { fadeWord.style.opacity = '1'; }, 50);

                // 一言を表示後、3.5秒待って最後の写真へ
                setTimeout(() => {
                    fadeWord.style.opacity = '0';
                    setTimeout(() => {
                        fadeWord.style.display = 'none';
                        showFinalPhoto();
                    }, 1500);
                }, 3500);

            }, 1000);
        }, 1000);
    }

    function showFinalPhoto() {
        const photoScreen = document.getElementById('final-photo-screen');
        document.getElementById('final-image').src = finalPhotoUrl;
        photoScreen.style.display = 'block';
        setTimeout(() => {
            photoScreen.style.opacity = '1';
        }, 50);
    }
</script>
</body>
</html>
